openapi: 3.0.0
paths:
  /v1/workspaces/{workspaceId}/events:
    get:
      operationId: EventsController_list
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from a previous response's meta.cursor.next_cursor
          schema:
            type: string
        - name: after_seq
          required: false
          in: query
          description: Return items with seq greater than this, oldest first (catch-up after reconnect).
            Ignored when cursor is set.
          schema:
            minimum: 0
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 50
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WireEventDto"
      security: &a1
        - cookie: []
      tags: &a2
        - Events
  /v1/workspaces/{workspaceId}/events/stream:
    get:
      operationId: EventsController_getStream
      parameters:
        - name: types
          required: false
          in: query
          description: Only deliver these event types (comma-separated or repeated)
          schema:
            type: array
            items:
              type: string
        - name: channel_ids
          required: false
          in: query
          description: Only deliver events for these channels
          schema:
            type: array
            items:
              type: string
        - name: after_seq
          required: false
          in: query
          description: Replay events after this seq first; the Last-Event-ID header takes precedence
          schema:
            type: number
      responses:
        "200":
          description: "text/event-stream of WireEvent frames (event: <type>, id: <seq>)"
      security: *a1
      tags: *a2
