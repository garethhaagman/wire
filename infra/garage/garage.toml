# Single-node Garage config for local dev only (mirrors Postgres/Redis — a plain,
# insecure dev credential is fine here; see docker-compose.yml). Garage is an
# Apache-2.0 S3-compatible object store used as the local stand-in for S3Adapter
# (apps/api/src/files/storage/s3-adapter.ts) instead of MinIO, whose server/console
# releases moved behind AGPLv3 licensing — see internal-docs/product discussion.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "854daa3f95e6d3d48df8e8bbec703c923f8326e441adbb1dd87922fcf33eefa3"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dev-admin-token-change-me"
