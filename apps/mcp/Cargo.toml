[package]
name = "wire-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Wire's MCP server: one tool per operation in internal-docs/api/openapi.yaml, served by rmcp-openapi"

[[bin]]
name = "wire-mcp"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.9", default-features = false, features = ["macros"] }
anyhow = "1"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.12", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server-session"] }
rmcp-actix-web = { version = "0.13.4", default-features = false, features = ["transport-streamable-http"] }
rmcp-openapi = "0.32.5"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
