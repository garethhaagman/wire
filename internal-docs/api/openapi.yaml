info:
  title: Wire API
  description: Primary HTTP surface for the Wire AI-native team messaging platform. Generated from
    @nestjs/swagger decorators in apps/api — do not hand-edit. Regenerate with `bun run
    openapi:export`.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    WireEventDto:
      type: object
      properties:
        id:
          type: object
          example: evt_01jd5x0k8f3v8q2m7n4r6t9w1y
        seq:
          type: number
          example: 48213
          description: Workspace-wide replay cursor (SSE id / Last-Event-ID)
        type:
          type: object
          example: message.created
        workspaceId:
          type: string
          example: ws_64d9dea525ae84ef6f7bd361
        channelId:
          type: string
          nullable: true
          example: ch_01jd5x0k8f3v8q2m7n4r6t9w1y
        data:
          type: object
          additionalProperties: true
          example:
            messageId: msg_01jd5x0k8f3v8q2m7n4r6t9w1y
            body: Hello!
          description: Event-type-specific payload — shape depends on `type`.
        createdAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
      required:
        - id
        - seq
        - type
        - workspaceId
        - channelId
        - data
        - createdAt
    PresenceEntryDto:
      type: object
      properties:
        memberId:
          type: string
          example: mem_01jd5x0k8f3v8q2m7n4r6t9w1y
        status:
          type: string
          enum:
            - active
        lastSeenAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
      required:
        - memberId
        - status
        - lastSeenAt
    TypingRequestDto:
      type: object
      properties:
        threadRootId:
          type: string
          example: msg_01jd5x0k8f3v8q2m7n4r6t9w1y
          description: Set when typing a thread reply
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          example: 2026-01-15T09:30:00.000Z
      required:
        - status
        - version
        - timestamp
    WorkspaceDto:
      type: object
      properties:
        id:
          type: object
          example: ws_64d9dea525ae84ef6f7bd361
        orgId:
          type: string
          example: org_8f2c1a6e9b3d4f05
        name:
          type: string
          example: Acme Corp
        dataRegion:
          type: string
          example: us
        createdAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
        updatedAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
      required:
        - id
        - orgId
        - name
        - dataRegion
        - createdAt
        - updatedAt
    CreateWorkspaceRequestDto:
      type: object
      properties:
        name:
          type: string
          example: Acme Corp
        dataRegion:
          type: string
          example: us
      required:
        - name
        - dataRegion
    UpdateWorkspaceRequestDto:
      type: object
      properties:
        name:
          type: string
          example: Acme Corp
    MemberDto:
      type: object
      properties:
        id:
          type: object
          example: mem_01jd5x0k8f3v8q2m7n4r6t9w1y
        workspaceId:
          type: string
          example: ws_64d9dea525ae84ef6f7bd361
        userId:
          type: string
          nullable: true
          example: usr_01jd5x0k8f3v8q2m7n4r6t9w1y
          description: Null until the invite is claimed
        displayName:
          type: string
          example: Jordan Lee
        email:
          type: string
          example: jordan@example.com
        role:
          type: string
          enum: &a29
            - owner
            - admin
            - member
            - guest
        createdAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
        updatedAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
      required:
        - id
        - workspaceId
        - userId
        - displayName
        - email
        - role
        - createdAt
        - updatedAt
    MemberPreferencesDto:
      type: object
      properties:
        starredChannelIds:
          type: array
          items:
            type: string
        mutedChannelIds:
          type: array
          items:
            type: string
      required:
        - starredChannelIds
        - mutedChannelIds
    UpdateMemberPreferencesRequestDto:
      type: object
      properties:
        starredChannelIds:
          type: array
          items:
            type: string
        mutedChannelIds:
          type: array
          items:
            type: string
    CreateMemberRequestDto:
      type: object
      properties:
        displayName:
          type: string
          example: Jordan Lee
        email:
          type: string
          example: jordan@example.com
        role:
          type: string
          enum: *a29
      required:
        - displayName
        - email
        - role
    UpdateMemberRequestDto:
      type: object
      properties:
        displayName:
          type: string
          example: Jordan Lee
        role:
          type: string
          enum: *a29
          description: Admin-only
    ChannelDto:
      type: object
      properties:
        id:
          type: object
          example: ch_01jd5x0k8f3v8q2m7n4r6t9w1y
        workspaceId:
          type: string
          example: ws_64d9dea525ae84ef6f7bd361
        name:
          type: string
          example: general
        type:
          type: string
          enum: &a30
            - public
            - private
            - dm
            - group_dm
        topic:
          type: string
          nullable: true
          example: Ship it 🚢
        purpose:
          type: string
          nullable: true
          example: Coordinating releases and incident response
        createdBy:
          type: string
          nullable: true
          example: mem_64d9dea525ae84ef6f7bd361
        memberCount:
          type: number
          example: 12
        lastMessageSeq:
          type: number
          example: 4821
          description: Highest message seq in the channel
        lastMessageAt:
          type: string
          nullable: true
          example: 2026-01-15T09:30:00.000Z
        archivedAt:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
        updatedAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
        isMember:
          type: boolean
          example: true
          description: Whether the requesting member belongs to the channel
        lastReadSeq:
          type: number
          nullable: true
          example: 4815
        unreadCount:
          type: number
          nullable: true
          example: 6
          description: Unread top-level messages, capped at 100
      required:
        - id
        - workspaceId
        - name
        - type
        - topic
        - purpose
        - createdBy
        - memberCount
        - lastMessageSeq
        - lastMessageAt
        - archivedAt
        - createdAt
        - updatedAt
        - isMember
        - lastReadSeq
        - unreadCount
    CreateChannelRequestDto:
      type: object
      properties:
        name:
          type: string
          example: general
          description: Required for public/private channels; ignored for dm/group_dm
        type:
          type: string
          enum: *a30
        topic:
          type: string
          example: Ship it 🚢
        purpose:
          type: string
          example: Coordinating releases and incident response
        memberIds:
          description: Initial members besides you; required for dm (1) and group_dm (2-7)
          type: array
          items:
            type: string
      required:
        - type
    UpdateChannelRequestDto:
      type: object
      properties:
        name:
          type: string
          example: general
        topic:
          type: string
          nullable: true
          example: Ship it 🚢
        purpose:
          type: string
          nullable: true
          example: Coordinating releases and incident response
    ChannelMemberDto:
      type: object
      properties:
        channelId:
          type: string
          example: ch_01jd5x0k8f3v8q2m7n4r6t9w1y
        memberId:
          type: string
          example: mem_64d9dea525ae84ef6f7bd361
        lastReadSeq:
          type: number
          example: 4815
        joinedAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
      required:
        - channelId
        - memberId
        - lastReadSeq
        - joinedAt
    AddChannelMemberRequestDto:
      type: object
      properties:
        memberId:
          type: string
          example: mem_64d9dea525ae84ef6f7bd361
          description: Your own member id to join, or another member's to add them
      required:
        - memberId
    MarkReadRequestDto:
      type: object
      properties:
        seq:
          type: number
          example: 4821
          description: Mark read up to this seq; omit to mark everything read
    MessageDto:
      type: object
      properties:
        id:
          type: object
          example: msg_01jd5x0k8f3v8q2m7n4r6t9w1y
        workspaceId:
          type: string
          example: ws_64d9dea525ae84ef6f7bd361
        channelId:
          type: string
          example: ch_01jd5x0k8f3v8q2m7n4r6t9w1y
        seq:
          type: number
          description: Per-channel monotonically increasing sequence
          example: 42
        threadRootId:
          type: string
          nullable: true
          example: msg_01jd5x0k8f3v8q2m7n4r6t9w1y
        broadcast:
          type: boolean
          description: Thread reply also shown in the channel
          example: false
        actorId:
          type: string
          example: mem_01jd5x0k8f3v8q2m7n4r6t9w1y
        actorType:
          type: string
          enum:
            - human
            - agent
            - system
        body:
          type: string
          example: Shipping the v2 config schema today.
        revision:
          type: number
          example: 1
        replyCount:
          type: number
          example: 3
        lastReplyAt:
          type: string
          nullable: true
          example: 2026-01-15T09:30:00.000Z
        reactionCounts:
          type: object
          additionalProperties:
            type: integer
          example:
            👍: 3
        editedAt:
          type: string
          nullable: true
          example: 2026-01-15T09:35:00.000Z
        deletedAt:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          example: 2026-01-15T09:00:00.000Z
        updatedAt:
          type: string
          example: 2026-01-15T09:35:00.000Z
      required:
        - id
        - workspaceId
        - channelId
        - seq
        - threadRootId
        - broadcast
        - actorId
        - actorType
        - body
        - revision
        - replyCount
        - lastReplyAt
        - reactionCounts
        - editedAt
        - deletedAt
        - createdAt
        - updatedAt
    CreateMessageRequestDto:
      type: object
      properties:
        body:
          type: string
          example: Shipping the v2 config schema today.
        threadRootId:
          type: string
          example: msg_01jd5x0k8f3v8q2m7n4r6t9w1y
      required:
        - body
    UpdateMessageRequestDto:
      type: object
      properties:
        body:
          type: string
          example: Shipping the v2 config schema today — now with examples.
        revision:
          type: number
          description: Expected current revision; 409 if the message has changed since
          example: 1
      required:
        - body
    AgentDto:
      type: object
      properties:
        id:
          type: object
          example: agt_64d9dea525ae84ef6f7bd361
        workspaceId:
          type: string
          example: ws_64d9dea525ae84ef6f7bd361
        handle:
          type: string
          example: oncall-bot
        harnessId:
          type: string
          example: harness_claude-code
        permissionSetId:
          type: string
          nullable: true
          example: pset_64d9dea525ae84ef6f7bd361
        status:
          type: string
          enum:
            - active
            - paused
            - deleted
        createdAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
        updatedAt:
          type: string
          example: 2026-01-15T09:30:00.000Z
      required:
        - id
        - workspaceId
        - handle
        - harnessId
        - permissionSetId
        - status
        - createdAt
        - updatedAt
    CreateAgentRequestDto:
