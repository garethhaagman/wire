            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: number
        - name: sort
          required: false
          in: query
          description: Field to sort by; prefix with - for descending
          schema:
            example: -createdAt
            type: string
        - name: search
          required: false
          in: query
          schema:
            example: launch
            type: string
        - name: filter
          required: false
          in: query
          description:
            Dynamic filter[field]=value params, see each endpoint's own @ApiQuery filter[...]
