# Local Tempo for Wire API traces. Mounted by docker-compose (profile: observability).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
  # TraceQL metrics (rate / quantile panels) reject ranges longer than this.
  metrics:
    max_duration: 24h
    max_exemplars: 100

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: wire-local
  storage:
    path: /var/tempo/generator/wal
    remote_write: []
  traces_storage:
    path: /var/tempo/generator/traces
  # local-blocks powers TraceQL metrics (rate / quantile_over_time) on the dashboard.
  processor:
    local_blocks:
      filter_server_spans: true
      flush_to_storage: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [ service-graphs, span-metrics, local-blocks ]
