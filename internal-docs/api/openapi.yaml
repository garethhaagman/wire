info:
  title: Wire API
  description: Primary HTTP surface for the Wire AI-native team messaging platform. Generated from
    @nestjs/swagger decorators in apps/api — do not hand-edit. Regenerate with `bun run
    openapi:export`.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        timestamp:
          type: string
      required:
        - status
        - version
        - timestamp
    WorkspaceDto:
      type: object
      properties:
        id:
          type: object
          example: ws_64d9dea525ae84ef6f7bd361
        orgId:
          type: string
        name:
          type: string
        dataRegion:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - orgId
        - name
        - dataRegion
        - createdAt
        - updatedAt
    CreateWorkspaceRequestDto:
      type: object
      properties:
        name:
          type: string
        dataRegion:
          type: string
          example: us
      required:
        - name
        - dataRegion
    MemberDto:
      type: object
      properties:
        id:
          type: object
          example: mem_64d9dea525ae84ef6f7bd361
        workspaceId:
          type: string
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - member
            - guest
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - displayName
        - email
        - role
        - createdAt
        - updatedAt
    CreateMemberRequestDto:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - member
            - guest
      required:
        - displayName
        - email
        - role
    ChannelDto:
      type: object
      properties:
        id:
          type: object
          example: ch_64d9dea525ae84ef6f7bd361
        workspaceId:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - public
            - private
            - dm
            - group_dm
        topic:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        archivedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - name
        - type
        - topic
        - purpose
        - archivedAt
        - createdAt
        - updatedAt
    CreateChannelRequestDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - public
            - private
            - dm
            - group_dm
        topic:
          type: string
        purpose:
          type: string
      required:
        - name
        - type
    MessageDto:
      type: object
      properties:
        id:
          type: object
          example: msg_64d9dea525ae84ef6f7bd361
        channelId:
          type: string
        threadRootId:
          type: string
          nullable: true
        actorId:
          type: string
        actorType:
          type: string
          enum:
            - human
            - agent
            - system
        body:
          type: string
        revision:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - channelId
        - threadRootId
        - actorId
        - actorType
        - body
        - revision
        - createdAt
        - updatedAt
    CreateMessageRequestDto:
      type: object
      properties:
        body:
          type: string
        threadRootId:
          type: string
      required:
        - body
    AgentDto:
      type: object
      properties:
        id:
          type: object
          example: agt_64d9dea525ae84ef6f7bd361
        workspaceId:
          type: string
        handle:
          type: string
        harnessId:
          type: string
        permissionSetId:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - paused
            - deleted
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - handle
        - harnessId
        - permissionSetId
        - status
        - createdAt
        - updatedAt
    CreateAgentRequestDto:
      type: object
      properties:
        handle:
          type: string
          example: oncall-bot
        harnessId:
          type: string
      required:
        - handle
        - harnessId
    CreateThreadReplyRequestDto:
      type: object
      properties:
        body:
          type: string
        broadcastToChannel:
          type: boolean
          description: Also post a copy of this reply to the channel
      required:
        - body
    ReactionDto:
      type: object
      properties:
        id:
          type: object
          example: rxn_64d9dea525ae84ef6f7bd361
        messageId:
          type: string
        actorId:
          type: string
        emoji:
          type: string
          example: 👍
        createdAt:
          type: string
      required:
        - id
        - messageId
        - actorId
        - emoji
        - createdAt
    CreateReactionRequestDto:
      type: object
      properties:
        emoji:
          type: string
          example: 👍
      required:
        - emoji
    PinDto:
      type: object
      properties:
        id:
          type: object
          example: pin_64d9dea525ae84ef6f7bd361
        channelId:
