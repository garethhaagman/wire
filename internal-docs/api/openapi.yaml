info:
  title: Wire API
  description: Primary HTTP surface for the Wire AI-native team messaging platform. Generated from
    @nestjs/swagger decorators in apps/api — do not hand-edit. Regenerate with `bun run
    openapi:export`.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    WireEventDto:
      type: object
      properties:
        id:
          type: object
          example: evt_01jd5x0k8f3v8q2m7n4r6t9w1y
        seq:
          type: number
          description: Workspace-wide replay cursor (SSE id / Last-Event-ID)
        type:
          type: object
          example: message.created
        workspaceId:
          type: string
        channelId:
          type: string
          nullable: true
        data:
          type: object
        createdAt:
          type: string
      required:
        - id
        - seq
        - type
        - workspaceId
        - channelId
        - data
        - createdAt
    PresenceEntryDto:
      type: object
      properties:
        memberId:
          type: string
        status:
          type: string
          enum:
            - active
        lastSeenAt:
          type: string
      required:
        - memberId
        - status
        - lastSeenAt
    TypingRequestDto:
      type: object
      properties:
        threadRootId:
          type: string
          description: Set when typing a thread reply
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        timestamp:
          type: string
      required:
        - status
        - version
        - timestamp
    WorkspaceDto:
      type: object
      properties:
        id:
          type: object
          example: ws_64d9dea525ae84ef6f7bd361
        orgId:
          type: string
        name:
          type: string
        dataRegion:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - orgId
        - name
        - dataRegion
        - createdAt
        - updatedAt
    CreateWorkspaceRequestDto:
      type: object
      properties:
        name:
          type: string
        dataRegion:
          type: string
          example: us
      required:
        - name
        - dataRegion
    UpdateWorkspaceRequestDto:
      type: object
      properties:
        name:
          type: string
    MemberDto:
      type: object
      properties:
        id:
          type: object
          example: mem_01jd5x0k8f3v8q2m7n4r6t9w1y
        workspaceId:
          type: string
        userId:
          type: string
          nullable: true
          description: Null until the invite is claimed
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: &a29
            - owner
            - admin
            - member
            - guest
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - userId
        - displayName
        - email
        - role
        - createdAt
        - updatedAt
    MemberPreferencesDto:
      type: object
      properties:
        starredChannelIds:
          type: array
          items:
            type: string
        mutedChannelIds:
          type: array
          items:
            type: string
      required:
        - starredChannelIds
        - mutedChannelIds
    UpdateMemberPreferencesRequestDto:
      type: object
      properties:
        starredChannelIds:
          type: array
          items:
            type: string
        mutedChannelIds:
          type: array
          items:
            type: string
    CreateMemberRequestDto:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: *a29
      required:
        - displayName
        - email
        - role
    UpdateMemberRequestDto:
      type: object
      properties:
        displayName:
          type: string
        role:
          type: string
          enum: *a29
          description: Admin-only
    ChannelDto:
      type: object
      properties:
        id:
          type: object
          example: ch_01jd5x0k8f3v8q2m7n4r6t9w1y
        workspaceId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: &a30
            - public
            - private
            - dm
            - group_dm
        topic:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        memberCount:
          type: number
        lastMessageSeq:
          type: number
          description: Highest message seq in the channel
        lastMessageAt:
          type: string
          nullable: true
        archivedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        isMember:
          type: boolean
          description: Whether the requesting member belongs to the channel
        lastReadSeq:
          type: number
          nullable: true
        unreadCount:
          type: number
          nullable: true
          description: Unread top-level messages, capped at 100
      required:
        - id
        - workspaceId
        - name
        - type
        - topic
        - purpose
        - createdBy
        - memberCount
        - lastMessageSeq
        - lastMessageAt
        - archivedAt
        - createdAt
        - updatedAt
        - isMember
        - lastReadSeq
        - unreadCount
    CreateChannelRequestDto:
      type: object
      properties:
        name:
          type: string
          description: Required for public/private channels; ignored for dm/group_dm
        type:
          type: string
          enum: *a30
        topic:
          type: string
        purpose:
          type: string
        memberIds:
          description: Initial members besides you; required for dm (1) and group_dm (2-7)
          type: array
          items:
            type: string
      required:
        - type
    UpdateChannelRequestDto:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
    ChannelMemberDto:
      type: object
      properties:
        channelId:
          type: string
        memberId:
          type: string
        lastReadSeq:
          type: number
        joinedAt:
          type: string
      required:
        - channelId
        - memberId
        - lastReadSeq
        - joinedAt
    AddChannelMemberRequestDto:
      type: object
      properties:
        memberId:
          type: string
          description: Your own member id to join, or another member's to add them
      required:
        - memberId
    MarkReadRequestDto:
      type: object
      properties:
        seq:
          type: number
          description: Mark read up to this seq; omit to mark everything read
    MessageDto:
      type: object
      properties:
        id:
          type: object
          example: msg_01jd5x0k8f3v8q2m7n4r6t9w1y
        workspaceId:
          type: string
        channelId:
          type: string
        seq:
          type: number
          description: Per-channel monotonically increasing sequence
        threadRootId:
          type: string
          nullable: true
        broadcast:
          type: boolean
          description: Thread reply also shown in the channel
        actorId:
          type: string
        actorType:
          type: string
          enum:
            - human
            - agent
            - system
        body:
          type: string
        revision:
          type: number
        replyCount:
          type: number
        lastReplyAt:
          type: string
          nullable: true
        reactionCounts:
          type: object
          additionalProperties:
            type: integer
          example:
            👍: 3
        editedAt:
          type: string
          nullable: true
        deletedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - channelId
        - seq
        - threadRootId
        - broadcast
        - actorId
        - actorType
        - body
        - revision
        - replyCount
        - lastReplyAt
        - reactionCounts
        - editedAt
        - deletedAt
        - createdAt
        - updatedAt
    CreateMessageRequestDto:
      type: object
      properties:
        body:
          type: string
        threadRootId:
          type: string
      required:
        - body
    UpdateMessageRequestDto:
      type: object
      properties:
        body:
          type: string
        revision:
          type: number
          description: Expected current revision; 409 if the message has changed since
      required:
        - body
    AgentDto:
      type: object
      properties:
        id:
          type: object
          example: agt_64d9dea525ae84ef6f7bd361
        workspaceId:
          type: string
        handle:
          type: string
        harnessId:
          type: string
        permissionSetId:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - paused
            - deleted
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - handle
        - harnessId
        - permissionSetId
        - status
        - createdAt
        - updatedAt
    CreateAgentRequestDto:
      type: object
      properties:
        handle:
          type: string
          example: oncall-bot
        harnessId:
          type: string
      required:
        - handle
        - harnessId
    UpdateAgentRequestDto:
      type: object
      properties:
        harnessId:
          type: string
        status:
          type: string
          enum:
            - active
            - paused
    CreateThreadReplyRequestDto:
      type: object
      properties:
        body:
          type: string
        broadcastToChannel:
          type: boolean
          description: Also post a copy of this reply to the channel
      required:
        - body
    ThreadReadStateDto:
      type: object
      properties:
        lastReadSeq:
          type: number
      required:
        - lastReadSeq
    ReactionDto:
      type: object
      properties:
        id:
          type: object
          example: rxn_64d9dea525ae84ef6f7bd361
        messageId:
          type: string
        actorId:
          type: string
        emoji:
          type: string
          example: 👍
        createdAt:
          type: string
      required:
        - id
        - messageId
        - actorId
        - emoji
        - createdAt
    CreateReactionRequestDto:
      type: object
      properties:
        emoji:
          type: string
          example: 👍
      required:
        - emoji
    PinDto:
      type: object
      properties:
        id:
          type: object
          example: pin_64d9dea525ae84ef6f7bd361
        channelId:
          type: string
        messageId:
          type: string
        pinnedBy:
          type: string
        createdAt:
          type: string
      required:
        - id
        - channelId
        - messageId
        - pinnedBy
        - createdAt
    CreatePinRequestDto:
      type: object
      properties:
        messageId:
          type: string
      required:
        - messageId
    BookmarkDto:
      type: object
      properties:
        id:
          type: object
          example: bkm_01jd5x0k8f3v8q2m7n4r6t9w1y
        workspaceId:
          type: string
        memberId:
          type: string
        messageId:
          type: string
        createdAt:
          type: string
      required:
        - id
        - workspaceId
        - memberId
        - messageId
        - createdAt
    CreateBookmarkRequestDto:
      type: object
      properties:
        messageId:
          type: string
      required:
        - messageId
    SearchResultDto:
      type: object
      properties:
        messageId:
          type: string
        workspaceId:
          type: string
        channelId:
          type: string
        threadRootId:
          type: string
          nullable: true
        actorId:
          type: string
        excerpt:
          type: string
          description: Matching snippet; hits wrapped in <mark></mark>
        score:
          type: number
          description: Relevance (ts_rank_cd); only comparable within one response
        createdAt:
          type: string
      required:
        - messageId
        - workspaceId
        - channelId
        - threadRootId
        - actorId
        - excerpt
        - score
        - createdAt
    WebhookEndpointDto:
      type: object
      properties:
        id:
          type: object
          example: whe_64d9dea525ae84ef6f7bd361
        workspaceId:
          type: string
        url:
          type: string
        enabledEvents:
          type: array
          items:
            type: string
        channelFilter:
          nullable: true
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - url
        - enabledEvents
        - channelFilter
        - createdAt
        - updatedAt
    CreateWebhookEndpointRequestDto:
      type: object
      properties:
        url:
          type: string
        enabledEvents:
          example:
            - message.created
            - thread.reply
          description: Event types, or "*" for all
          type: array
          items:
            type: string
        channelFilter:
          description: Only deliver channel events from these channels
          type: array
          items:
            type: string
      required:
        - url
        - enabledEvents
    WebhookEndpointCreatedDto:
      type: object
      properties:
        id:
          type: object
          example: whe_64d9dea525ae84ef6f7bd361
        workspaceId:
          type: string
        url:
          type: string
        enabledEvents:
          type: array
          items:
            type: string
        channelFilter:
          nullable: true
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        secret:
          type: string
          description: Shown once. Store it — it cannot be retrieved again.
      required:
        - id
        - workspaceId
        - url
        - enabledEvents
        - channelFilter
        - createdAt
        - updatedAt
        - secret
    AuditEventDto:
