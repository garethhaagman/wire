openapi: 3.0.0
paths:
  /v1/workspaces/{workspaceId}/events:
    get:
      operationId: list_events
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
          description: Workspace id (ws_...). List the caller's workspaces with list_workspaces.
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from a previous response's meta.cursor.next_cursor
          schema:
            type: string
        - name: after_seq
          required: false
          in: query
          description:
            Return items with seq greater than this, oldest first (catch-up after reconnect).
            Ignored when cursor is set.
          schema:
            minimum: 0
            type: number
        - name: per_page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 50
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WireEventDto"
      security: &a1
        - cookie: []
      summary: Replay or poll durable workspace events the caller can see, oldest first
      tags: &a2
        - Events
  /v1/workspaces/{workspaceId}/events/stream:
    get:
      operationId: stream_events
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
          description: Workspace id (ws_...). List the caller's workspaces with list_workspaces.
        - name: types
          required: false
          in: query
          description: Only deliver these event types (comma-separated or repeated)
          schema:
            type: array
            items:
              type: string
        - name: channel_ids
          required: false
          in: query
          description: Only deliver events for these channels
          schema:
            type: array
            items:
              type: string
        - name: after_seq
          required: false
          in: query
          description: Replay events after this seq first; the Last-Event-ID header takes precedence
          schema:
            example: 48000
            type: number
      responses:
        "200":
          description: "text/event-stream of WireEvent frames (event: <type>, id: <seq>)"
      security: *a1
      summary: Open a server-sent event stream of live workspace events
      tags: *a2
      x-wire-mcp:
        exclude: true
  /v1/workspaces/{workspaceId}/presence:
    post:
      operationId: send_presence_heartbeat
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
          description: Workspace id (ws_...). List the caller's workspaces with list_workspaces.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "null"
      security: *a1
      summary: Mark the caller as online in the workspace
      tags: *a2
      x-wire-mcp:
        exclude: true
    get:
      operationId: list_presence
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
          description: Workspace id (ws_...). List the caller's workspaces with list_workspaces.
      responses:
