name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.9"

jobs:
  # Near-instant correctness/style pass (Biome: lint + format, via Ultracite's
  # config). Runs first and alone (no bun install needed) so a trivial typo
  # fails in seconds, not after waiting behind every other job's dependency
  # install.
  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  # Each of these restores the same bun-cache key populated above (or, on a
  # cache miss, installs itself — nothing here blocks on another job). They
  # run as independent jobs, not independent steps in one job, specifically so
  # GitHub Actions schedules them on separate runners in parallel instead of
  # serially on one.
  #
  # Scoped to the repo's own ESLint rule plugins (wire-api, wire-ui) —
  # everything generic is Biome's job above. Biome can't load custom
  # ESLint plugins, so this is where Wire-specific/architectural rules
  # (permission checks, response envelope shape, ...) live.
  wire-rules:
    name: wire-rules (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-wire-rules-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-wire-rules-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run lint:wire-rules check:theme
      - run: bun run lint:md

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run test

  # Non-blocking: knip already has pre-existing false positives on main (it
  # can't see classes used only via decorator reflection, e.g. the Swagger DTO
  # classes in apps/api/src/**/dto/*.dto.ts) that are a separate cleanup task,
  # not something this pipeline enforces. Runs and reports so drift stays
  # visible without failing the build on a known gap.
  knip:
    name: knip (unused code)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run knip

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build

  # One Docker build per app image, run in parallel (matrix), each with its
  # own GitHub Actions layer cache so an unrelated app's change doesn't
  # invalidate another's cached layers. Images are built, never pushed, on a
  # PR — this validates the Dockerfile and catches a broken image before
  # merge; pushing to a registry is a separate, deploy-triggered workflow.
  docker-build:
    name: docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ api, web, docs ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
