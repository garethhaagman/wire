name: wire

# `docker compose up` starts only Postgres and Redis; apps run natively via `make dev`.
# The app containers are opt-in: `docker compose --profile docker up` (or `make docker-up`).
# The local S3-compatible store (Garage) is also opt-in: `docker compose --profile s3 up`
# — apps/api's FilesService defaults to LocalDiskAdapter (zero config, see
# apps/api/src/files/storage/local-disk-adapter.ts) and only needs Garage/S3 when you
# want to exercise the real S3Adapter path locally.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wire
      POSTGRES_PASSWORD: wire_dev_password
      POSTGRES_DB: wire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wire -d wire"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sessions cache, rate limits, idempotency keys, presence, and realtime pub/sub.
  # Everything in it is reconstructible — Postgres is the source of truth.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apache-2.0 S3-compatible object store for local dev — not MinIO, whose
  # server/console releases moved behind AGPLv3 licensing. Speaks the real S3 API,
  # so apps/api/src/files/storage/s3-adapter.ts needs no Garage-specific code, only
  # S3_ENDPOINT pointed here instead of real AWS (see apps/api/.env.example).
  #
  # One-time setup after first `docker compose --profile s3 up -d garage` — the
  # official image is scratch-based (no shell), so this is a host-side script
  # driving the `garage` CLI via `docker compose exec` rather than a script
  # copied into the container:
  #
  #   ./infra/garage/init.sh
  #
  # It prints where it wrote the generated S3 credentials (Garage can't be told
  # a chosen access-key-id/secret-key at creation time) — copy them into
  # apps/api/.env. Re-running after the first time is a no-op.
  garage:
    profiles: ["s3"]
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["docker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /repo/packages/db
    command: ["bun", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://wire:wire_dev_password@postgres:5432/wire
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["docker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgres://wire:wire_dev_password@postgres:5432/wire
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: dev-only-secret-change-me-32chars-min
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["docker"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - api

  docs:
    profiles: ["docker"]
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  garage_meta:
  garage_data:
